[ebo-optimization-level]
ebo-optimization-level=Optimization level

[ebo-optimization-level-description]
ebo-optimization-level=Minimal keeps most visuals; balanced is recommended; aggressive maximizes UPS savings.

[ebo-reduce-death-explosions]
ebo-reduce-death-explosions=Reduce death explosions

[ebo-reduce-death-explosions-description]
ebo-reduce-death-explosions=Lighten explosion prototypes when explosive biters and worms die.

[ebo-reduce-fire-spread]
ebo-reduce-fire-spread=Reduce fire spread

[ebo-reduce-fire-spread-description]
ebo-reduce-fire-spread=Limit fire entities and spread from explosive unit deaths.

[ebo-reduce-particle-effects]
ebo-reduce-particle-effects=Reduce particle effects

[ebo-reduce-particle-effects-description]
ebo-reduce-particle-effects=Fewer smoke and spark particles from explosions and attacks.

[ebo-downscale-textures]
ebo-downscale-textures=Downscale Explosive Biters textures

[ebo-downscale-textures-description]
ebo-downscale-textures=Allow half-resolution loading of Explosive Biters biter/spitter/spawner sprites to save VRAM (same approach as vanilla biters).

